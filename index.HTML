<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY DOCTOR'S APPOINTMENT</title>
</head>
<body>
    <h1>MY DOCTOR'S APPOINTMENT</h1>
    <p>FILL IN THE FORM BELOW TO BOOK YOUR APPOINTMENT</p>
    <hr>
    <form action="">
        <fieldset>
            <legend>PERSONAL DEATAILS</legend>
            <label for="">YOUR NAME</label>
            <br>
            <input type="text" id="name" placeholder="Enter your full name:">
            <br><br>
            <label for="">Patient ID</label><br>
            <input type="text" id="pid" placeholder="Your Patient ID">
            <br><br>
            <label for="">Date Of Birth</label><br>
            <input type="date" id="dob">
            <br><br>
        </fieldset>
        <br>
        <fieldset>
            <legend>YOUR VISIT</legend>
            <label for="">Choose Your Doctor</label><br>
            <select name="" id="doctor">
                <option value="dr-ray">Dr. Ray - NEPHROLOGY</option>
                <option value="dr-lee">Dr. Lee - CARDIOLOGY</option>
                <option value="dr-sam">Dr. Sam - ORTHOPEDIC</option>
                <option value="dr-paarth">Dr. Paarth - NEUROLOGY</option>
            </select>
            <br><br>
            <label for="">Why Are You Visiting?</label><br>
            <input type="radio" name="reason" id="abdominalpain">Abdominal Pain <br>
            <input type="radio" name="reason" id="headache">Headache <br>
            <input type="radio" name="reason" id="chestpain">Chest Pain <br>
            <input type="radio" name="reason" id="kneepain">Knee Pain <br>
            <br>
            <label for="">Any Notes For The Doctor?</label>
            <textarea name="" id="notes" rows="3" cols="35"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="book and appointment">
    </form>
</body>
</html>
